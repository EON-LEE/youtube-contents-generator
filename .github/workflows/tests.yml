name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media test dependencies
        run: python -m pip install -c requirements-windows-py312.txt -e ".[media]"
      - name: Test without external synthesis or uploads
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

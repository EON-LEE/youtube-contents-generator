[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-pipeline"
version = "0.1.0"
description = "Human-reviewed illustrated audio stories with offline simulation and local video production"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
media = [
    "edge-tts>=7.2,<8",
    "Pillow>=11,<13",
    "imageio-ffmpeg>=0.6,<0.7",
]
evaluation = [
    "faster-whisper>=1.1,<2",
]

[project.scripts]
story-pipeline = "story_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

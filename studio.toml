# Studio configuration. Environment variables override endpoints:
# FOUNDRY_PROJECT_ENDPOINT, FOUNDRY_IMAGE_DEPLOYMENT, SPEECH_ENDPOINT, SPEECH_REGION.
#
# Deployment names and prices below are PLACEHOLDERS chosen for the planned model mix.
# `python -m story_pipeline studio check-models` must pass against the real Foundry
# project (deployed names, region availability, current prices) before any live run.

[foundry]
project_endpoint = ""
image_deployment = "gpt-image-1"

[speech]
endpoint = ""
region = "koreacentral"

[budget]
episode_usd = 10

[episode]
# Measured on the v2 sample: 7,859 characters -> 1,296.5 s (about 6.06 characters/second).
target_characters = [7300, 10500]

[channel]
directory = "channel"

[loops]
concept_rounds = 2
script_rounds = 3
minimum_improvement = 0.2
direction_retries = 2
art_retries_per_shot = 2
final_retries = 1

[thresholds]
concept = 7.0
script_axis = 7.0
art = 7.0
packaging = 7.0
final = 7.5

# One deployment per agent. Writers and their reviewers must be different model families.
# NOTE (2026-10-09): Claude (Anthropic) deployments are removed. This subscription
# (ME-M365CPI74210306-eonlee-1, an M365 Developer Program sandbox) blocks paid Azure
# Marketplace purchases by policy, and Anthropic models in Foundry are sold through
# the Marketplace. DeepSeek and xAI/Grok are NOT blocked (verified by real deployment).
# If a non-sandbox subscription is used later, Claude can be reintroduced; see
# infra/main.parameters.json (claude entries removed from modelDeployments there too).
[agents]
showrunner = "gpt-5.5"
trend-researcher = "gpt-5-mini"
performance-analyst = "gpt-5.5"
concept-writer-a = "deepseek-v3-2"
concept-writer-b = "grok-4-1"
concept-writer-c = "deepseek-v3-2"
greenlight-judge-a = "gpt-5.5"
greenlight-judge-b = "gpt-5-mini"
outline-writer = "gpt-5.5"
scene-writer = "gpt-5.5"
critic-continuity = "deepseek-v3-2"
critic-engagement = "grok-4-1"
critic-korean = "deepseek-v3-2"
critic-originality = "grok-4-1"
critic-policy = "deepseek-v3-2"
arbiter = "gpt-5.5"
script-doctor = "gpt-5.5"
director = "gpt-5.5"
voice-director = "gpt-5-mini"
art-director = "gpt-5.5"
art-critic = "gpt-5.5"
packaging-agent = "grok-4-1"
click-judge = "gpt-5.5"
final-judge = "deepseek-v3-2"
retrospective = "gpt-5.5"

[prices]
# USD. Conservative placeholders; replace with current Azure prices.
image_per_call = 0.07
speech_per_million_characters = 15

[prices.models."gpt-5.5"]
input_per_million = 5
output_per_million = 40

[prices.models."gpt-5-mini"]
input_per_million = 0.5
output_per_million = 4

# Anthropic Claude models are deployed in infra/main.bicep but NOT used by any agent
# above: this subscription blocks the Marketplace purchase they require (see the
# [agents] note). Prices kept here so Claude can be reassigned without edits if a
# non-sandbox subscription is used later.
[prices.models."claude-opus-5-5"]
input_per_million = 5
output_per_million = 25

[prices.models."claude-sonnet-5"]
input_per_million = 3
output_per_million = 15

[prices.models."deepseek-v3-2"]
input_per_million = 1
output_per_million = 4

[prices.models."grok-4-1"]
input_per_million = 3
output_per_million = 15
